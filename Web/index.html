<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#101a36">
	<title>Clima — previsão do tempo</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
		:root{color-scheme:dark;--bg:#0c1327;--panel:#151f3b;--muted:#9ba9c9;--white:#f5f7ff;--blue:#8eb6ff;--line:rgba(255,255,255,.1)}
		*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 0%,#263d73 0,transparent 38%),radial-gradient(ellipse at 100% 80%,#202c59 0,transparent 34%),var(--bg);color:var(--white);font-family:'DM Sans',sans-serif;padding:38px 20px 50px}
		.app{max-width:1050px;margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:34px}.brand{font:800 21px Manrope,sans-serif;letter-spacing:-.7px}.brand span{color:var(--blue)}.search{display:flex;align-items:center;gap:10px;width:min(410px,65vw);padding:7px 8px 7px 16px;border:1px solid var(--line);border-radius:14px;background:rgba(12,19,39,.55)}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--white);font:inherit}.search input::placeholder{color:#8794b2}.search button,.location{border:0;color:#101a36;background:var(--blue);font:700 13px 'DM Sans',sans-serif;cursor:pointer;border-radius:10px;padding:10px 14px;white-space:nowrap;transition:.2s}.search button:hover,.location:hover{background:#b3ceff;transform:translateY(-1px)}
		.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.eyebrow{font-size:12px;color:var(--blue);font-weight:700;letter-spacing:1.4px;text-transform:uppercase}.heading h1{font:700 clamp(25px,4vw,36px) Manrope,sans-serif;margin:7px 0 0;letter-spacing:-1.2px}.date{color:var(--muted);font-size:14px;text-align:right}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.card{border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,rgba(31,46,83,.92),rgba(21,31,59,.9));box-shadow:0 18px 50px rgba(0,0,0,.16)}.current{padding:27px 30px;min-height:285px;position:relative;overflow:hidden}.current:after{content:'';position:absolute;width:250px;height:250px;right:-60px;top:-75px;border-radius:50%;background:rgba(124,166,255,.08);pointer-events:none}.place{font-size:17px;font-weight:600}.country{color:var(--muted);font-size:13px;margin-top:3px}.current-main{display:flex;align-items:center;gap:18px;margin:27px 0 23px}.weather-icon{font-size:64px;line-height:1;filter:drop-shadow(0 8px 14px rgba(255,207,100,.18))}.temperature{font:500 66px/.95 Manrope,sans-serif;letter-spacing:-5px}.condition{color:#d7e0f6;margin-top:8px;font-size:15px}.metrics{display:flex;gap:26px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}.metrics strong{color:var(--white);font-size:14px;margin-left:5px}.side{display:grid;grid-template-rows:1fr 1fr;gap:16px}.mini{padding:22px 24px}.card-title{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.3px}.sun-row{display:flex;align-items:center;justify-content:space-between;margin-top:19px}.sun-item{display:flex;align-items:center;gap:11px}.sun-item .symbol{font-size:24px}.sun-item small{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}.sun-item strong{font-size:15px}.sun-track{height:5px;border-radius:5px;background:linear-gradient(90deg,#547fe5,#f8cf78,#547fe5);margin:17px 5px 0;opacity:.8}.wind-value{font:600 25px Manrope,sans-serif;margin-top:17px}.wind-value span{font:400 13px 'DM Sans',sans-serif;color:var(--muted)}.wind-meta{color:var(--muted);font-size:12px;margin-top:4px}.section-title{font:700 18px Manrope,sans-serif;margin:26px 0 13px}.forecast{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.forecast-card{padding:17px 8px;text-align:center;border:1px solid var(--line);border-radius:17px;background:rgba(21,31,59,.8)}.forecast-card .day{font-size:12px;color:var(--muted)}.forecast-card .icon{font-size:25px;margin:11px 0}.forecast-card .high{font-weight:700}.forecast-card .low{font-size:12px;color:var(--muted);margin-left:5px}.status{min-height:20px;color:#ffb6b6;font-size:13px;margin-top:13px}.loading{opacity:.6}.footer{text-align:center;color:#7280a0;font-size:11px;margin-top:25px}
		@media(max-width:700px){body{padding:24px 15px 35px}.topbar{align-items:flex-start;flex-direction:column;margin-bottom:27px}.search{width:100%}.grid{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr;grid-template-rows:auto}.current{padding:23px}.forecast{grid-template-columns:repeat(3,1fr)}.heading{align-items:flex-start}.date{max-width:125px;line-height:1.5}.metrics{gap:15px;justify-content:space-between}.mini{padding:18px 15px}.sun-row{gap:10px}.sun-item{gap:6px}.sun-item strong{font-size:13px}}
		@media(max-width:390px){.side{grid-template-columns:1fr}.current-main{gap:12px}.temperature{font-size:58px}.weather-icon{font-size:54px}}
	</style>
</head>
<body>
	<main class="app">
		<header class="topbar">
			<div class="brand">clima<span>.</span></div>
			<form class="search" id="searchForm" role="search">
				<input id="cityInput" type="search" placeholder="Buscar cidade..." aria-label="Buscar cidade" autocomplete="off">
				<button type="submit">Buscar</button>
			</form>
		</header>

		<section class="heading">
			<div><div class="eyebrow">Acompanhe o tempo</div><h1>Previsão do tempo</h1></div>
			<div class="date" id="today"></div>
		</section>

		<div class="grid" id="weatherContent">
			<section class="card current" aria-live="polite">
				<div class="place" id="place">Carregando...</div><div class="country" id="country">Buscando condições atuais</div>
				<div class="current-main"><div class="weather-icon" id="currentIcon">⛅</div><div><div class="temperature"><span id="temperature">--</span>°</div><div class="condition" id="condition">Aguarde...</div></div></div>
				<div class="metrics"><div>Sensação<strong><span id="feels">--</span>°</strong></div><div>Umidade<strong><span id="humidity">--</span>%</strong></div><div>Chuva<strong><span id="rain">--</span>%</strong></div></div>
			</section>
			<div class="side">
				<section class="card mini"><div class="card-title">Nascer e pôr do sol</div><div class="sun-row"><div class="sun-item"><span class="symbol">🌅</span><div><small>Nascer</small><strong id="sunrise">--:--</strong></div></div><div class="sun-item"><span class="symbol">🌇</span><div><small>Pôr do sol</small><strong id="sunset">--:--</strong></div></div></div><div class="sun-track"></div></section>
				<section class="card mini"><div class="card-title">Vento agora</div><div class="wind-value"><span id="wind">--</span> <span>km/h</span></div><div class="wind-meta">Direção <span id="windDirection">--</span>°</div></section>
			</div>
		</div>

		<div class="status" id="status" role="status"></div>
		<h2 class="section-title">Próximas horas</h2>
		<section class="forecast" id="forecast" aria-label="Previsão para as próximas horas"></section>
		<div class="footer">Dados meteorológicos por Open-Meteo</div>
	</main>
	<script>
		const $ = id => document.getElementById(id);
		const weatherInfo = code => {
			if (code === 0) return ['Céu limpo', '☀️'];
			if ([1, 2].includes(code)) return ['Parcialmente nublado', '🌤️'];
			if (code === 3) return ['Nublado', '☁️'];
			if ([45, 48].includes(code)) return ['Neblina', '🌫️'];
			if ([51, 53, 55, 56, 57].includes(code)) return ['Garoa', '🌦️'];
			if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return ['Chuva', '🌧️'];
			if ([71, 73, 75, 77, 85, 86].includes(code)) return ['Neve', '🌨️'];
			if ([95, 96, 99].includes(code)) return ['Trovoada', '⛈️'];
			return ['Condição variável', '🌥️'];
		};
		const time = value => new Date(value).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
		$('today').textContent = new Intl.DateTimeFormat('pt-BR', {weekday:'long', day:'numeric', month:'long'}).format(new Date());

		async function loadWeather(latitude, longitude, name, country='') {
			$('status').textContent = '';
			$('weatherContent').classList.add('loading');
			try {
				const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation_probability,weather_code,wind_speed_10m,wind_direction_10m&hourly=temperature_2m,weather_code&daily=sunrise,sunset&timezone=auto&forecast_days=2`;
				const response = await fetch(url);
				if (!response.ok) throw new Error('Não foi possível carregar a previsão.');
				const data = await response.json(), current = data.current;
				const [description, icon] = weatherInfo(current.weather_code);
				$('place').textContent = name;
				$('country').textContent = country || 'Condições atuais';
				$('temperature').textContent = Math.round(current.temperature_2m);
				$('condition').textContent = description;
				$('currentIcon').textContent = current.is_day ? icon : (current.weather_code === 0 ? '🌙' : icon);
				$('feels').textContent = Math.round(current.apparent_temperature);
				$('humidity').textContent = current.relative_humidity_2m;
				$('rain').textContent = current.precipitation_probability ?? 0;
				$('wind').textContent = Math.round(current.wind_speed_10m);
				$('windDirection').textContent = Math.round(current.wind_direction_10m);
				const todayIndex = data.daily.time.indexOf(current.time.slice(0, 10));
				const day = todayIndex >= 0 ? todayIndex : 0;
				$('sunrise').textContent = time(data.daily.sunrise[day]);
				$('sunset').textContent = time(data.daily.sunset[day]);
				const start = data.hourly.time.findIndex(t => t >= current.time);
				$('forecast').innerHTML = Array.from({length:6}, (_, i) => {
					const index = Math.max(0, start) + i;
					const [label, symbol] = weatherInfo(data.hourly.weather_code[index]);
					const hour = time(data.hourly.time[index]);
					return `<article class="forecast-card" title="${label}"><div class="day">${i === 0 ? 'Agora' : hour}</div><div class="icon">${symbol}</div><span class="high">${Math.round(data.hourly.temperature_2m[index])}°</span></article>`;
				}).join('');
			} catch (error) {
				$('status').textContent = 'Não foi possível obter a previsão. Verifique sua conexão e tente novamente.';
			} finally { $('weatherContent').classList.remove('loading'); }
		}

		async function searchCity(city) {
			if (!city.trim()) return;
			$('status').textContent = 'Buscando cidade...';
			try {
				const response = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=pt&format=json`);
				const data = await response.json();
				if (!data.results?.length) throw new Error('Cidade não encontrada.');
				const result = data.results[0];
				await loadWeather(result.latitude, result.longitude, result.name, [result.admin1, result.country].filter(Boolean).join(', '));
			} catch (error) { $('status').textContent = error.message || 'Erro ao buscar cidade.'; }
		}
		$('searchForm').addEventListener('submit', event => { event.preventDefault(); searchCity($('cityInput').value); });
		loadWeather(-23.5505, -46.6333, 'São Paulo', 'São Paulo, Brasil');
	</script>
</body>
</html>
